<phub-header />
<phub-loader></phub-loader>

<div class="container">
  <div class="creating-form-background">
    <div class="creating-form-background__content">
      <h2 class="title-content">
        Cadastrar Temporada - {{ getCareerDetails()?.teamCareer }}
      </h2>
      <div class="creating-form-background__form">
        <form [formGroup]="formSeason">
          <div class="input-form">
            <label for="seasonName">Nome da Temporada:</label>
            <input
              type="text"

              #searchSeason
              placeholder="Digite aqui..."
              formControlName="seasonName"
              [matAutocomplete]="autoSeason"
              (input)="onSearchUpdatedSeasonName(searchSeason.value)"
              appUpperCase
            />
            <mat-autocomplete #autoSeason="matAutocomplete">
              @for (season of getSeasons(); track season) {
              <mat-option [value]="season">{{
                showSeason(season)
              }}</mat-option>
              }
            </mat-autocomplete>
          </div>
          <div class="input-form">
            <label for="games">Jogos:</label>
            <input
              formControlName="games"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
          <div class="input-form">
            <label for="wins">Vitórias:</label>
            <input
              formControlName="wins"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
          <div class="input-form">
            <label for="draws">Empates:</label>
            <input
              formControlName="draws"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus

            />
          </div>
          <div class="input-form">
            <label for="losses">Derrotas:</label>
            <input
              formControlName="losses"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus

            />
          </div>
          <div class="input-form">
            <label for="goalsConceded">Gols sofridos:</label>
            <input
              formControlName="goalsConceded"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
          <div class="input-form">
            <label for="goalsScored">Gols marcados:</label>
            <input
              formControlName="goalsScored"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
          <button
            type="submit"
            class="btn-primary"
            [disabled]="formSeason.invalid"
            (click)="submitForm()"
          >
            Cadastrar Temporada
          </button>
        </form>
      </div>

      @if (getCareerDetails(); as careerDetails) {
      <phub-details-photo [clubName]="careerDetails.teamCareer" />
      }

      <button [routerLink]="['/']" class="btn-arrow-return">
        <img src="../../../assets/icons/voltar.svg" alt="Voltar para a Home" />
      </button>
    </div>
  </div>
</div>
