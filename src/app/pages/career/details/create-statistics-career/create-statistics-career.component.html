<app-header />
<phub-loader></phub-loader>

<div class="container">
  <div class="creating-form-background">
    <div class="creating-form-background__content">
      <h2 class="title-content">
        {{
          pathAlias() === "edit" ? "Editar Estatisticas" : "Criar Estatisticas"
        }}
        - {{ showSeason(season()) }} - {{ getCareerDetails()?.teamCareer }}
      </h2>
      <div class="creating-form-background__form">
        <form [formGroup]="formStatistics">
          <div class="input-form">
            <label for="games">Partidas:</label>
            <input
              formControlName="games"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
          <div class="input-form">
            <label for="wins">Vitórias:</label>
            <input
              formControlName="wins"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
          <div class="input-form">
            <label for="draws">Empates:</label>
            <input
              formControlName="draws"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>

          <div class="input-form">
            <label for="losses">Derrotas:</label>
            <input
              formControlName="losses"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
          <div class="input-form">
            <label for="goalsConceded">Gols sofridos:</label>
            <input
              formControlName="goalsConceded"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
          <div class="input-form">
            <label for="goalsScored">Gols marcados:</label>
            <input
              formControlName="goalsScored"
              placeholder="Digite aqui..."
              type="text"
              maxlength="3"
              phubClearOnFocus
            />
          </div>
        </form>
        <button
          type="submit"
          class="btn-primary"
          [disabled]="formStatistics.invalid"
          (click)="submitForm(getSeason()?.id!)"
        >
          {{
            pathAlias() === "edit"
              ? "Editar Estatisticas"
              : "Criar Estatisticas"
          }}
        </button>
      </div>
    </div>

    <div class="show-error-modal">
      <h4 class="text-warn">{{ messageError() }}</h4>
    </div>
    }
    <button [routerLink]="['/']" class="btn-arrow-return">
      <img src="../../../assets/icons/voltar.svg" alt="Voltar para a Home" />
    </button>

    <phub-details-photo
      [clubName]="getTeamCareer"
      [personName]="getCoachesName"
      [url]="getUrl"
    /> -->
  </div>
</div>
